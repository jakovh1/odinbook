default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default
  adapter: solid_queue
  connects_to:
    database:
      writing: queue
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  <<: *default

production:
  <<: *default
